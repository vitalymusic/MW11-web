<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            height: 150px;
            background: #d9d9d9;
            line-height: 150px;


        }

        nav{
            height: 75px;
            line-height: 75px;
            background: #24d680;

        }
        

        div.container{
            height: 699px;
            background: #2c7aed;
            display: flex;

            .left-sidebar, .right-sidebar{
                  height: 699px;
                  width: 10%;
                  background-color: #c324d6;

            }

            .center-content{
                height: 699px;
                width: 80%;
                /* background-color: #ccf306; */
            }

            


        }


        footer{
            height: 100px;
            background: #d9d9d9;
            line-height: 100px;
        }






        .text-format {
            color: rgba(0, 0, 0, 1);
            font-family: Inter;
            font-style: normal;
            font-size: 38px;
            font-weight: 400;
            text-align: center;

        }
    </style>
</head>

<body>
    <header class="text-format">
        Header - #D9D9D9
    </header>
    <nav class="text-format">
        Nav - #D9D9D9
    </nav>
    <div class="container">
        <div class="left-sidebar"></div>
        <div class="center-content"></div>
        <div class="right-sidebar"></div>
    </div>
    <footer class="text-format">
        Footer - #D9D9D9
    </footer>
</body>

</html>
